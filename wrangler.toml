name = "runescript"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only /api/* runs the Worker first; everything else is served straight from dist/.
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "PRICES"
id = "bf17c20bc3d242568f18d8d6fed1e25d"

[observability]
enabled = true
